<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161310" media="(prefers-color-scheme: dark)">
<title>Team Shammi — Performance Ledger</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Outfit:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE LEDGER — final-7 full redesign
   Light-first paper aesthetic. Ink, rules, figures.
   ============================================================ */
:root{
  --paper:#FAF8F3;
  --paper-deep:#F3EFE6;
  --card:#FFFDF9;
  --ink:#1B1712;
  --ink-soft:#4A443B;
  --ink-faint:#7A7266;
  --rule:#E4DCCC;
  --rule-strong:#CFC3AC;
  --accent:#0E7C4A;        /* ledger green ink */
  --accent-deep:#0A5C37;
  --danger:#B42318;        /* ledger red ink */
  --danger-deep:#8A1A12;
  --warn:#A66A16;
  --gold:#8A6D1F;
  --info:#1D5FA8;
  --tint-green:rgba(14,124,74,.08);
  --tint-red:rgba(180,35,24,.07);
  --tint-amber:rgba(166,106,22,.09);
  --shadow-1:0 1px 2px rgba(27,23,18,.05);
  --shadow-2:0 1px 2px rgba(27,23,18,.06),0 8px 24px -12px rgba(27,23,18,.18);
  --shadow-3:0 2px 6px rgba(27,23,18,.08),0 24px 60px -20px rgba(27,23,18,.28);
  --serif:"Newsreader","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Outfit",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
  --paper:#161310;
  --paper-deep:#100E0B;
  --card:#1D1915;
  --ink:#F0E9DB;
  --ink-soft:#C9BFAE;
  --ink-faint:#8D8474;
  --rule:#2E2820;
  --rule-strong:#453C2E;
  --accent:#3ECF8E;
  --accent-deep:#2BA96F;
  --danger:#F0665A;
  --danger-deep:#D14A3E;
  --warn:#E0A83E;
  --gold:#D9B64A;
  --info:#6FA8E8;
  --tint-green:rgba(62,207,142,.10);
  --tint-red:rgba(240,102,90,.10);
  --tint-amber:rgba(224,168,62,.12);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.55);
  --shadow-3:0 2px 8px rgba(0,0,0,.5),0 28px 70px -20px rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  font-size:16px;line-height:1.5;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:radial-gradient(rgba(27,23,18,.045) 1px,transparent 1px);
  background-size:22px 22px;
}
html[data-theme="dark"] body{background-image:radial-gradient(rgba(240,233,219,.035) 1px,transparent 1px)}
::selection{background:var(--accent);color:#fff}
.mono-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Skip link */
.skip-link{position:absolute;left:16px;top:-60px;z-index:200;background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:8px;font-weight:700;text-decoration:none;
  transition:top .18s ease-out}
.skip-link:focus{top:12px}

/* ============ MASTHEAD ============ */
.masthead{border-bottom:3px double var(--rule-strong);background:var(--paper);position:sticky;top:0;z-index:60}
.masthead-inner{max-width:1440px;margin:0 auto;padding:18px 32px 0}
.masthead-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand-block{display:flex;align-items:center;gap:16px}
.brand-mark{width:48px;height:48px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card)}
.brand-mark svg{width:26px;height:26px;color:var(--accent)}
.brand-name{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{font-size:12.5px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:2px}
.dateline{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-faint);text-align:right;line-height:1.6}
.dateline strong{font-style:normal;font-family:var(--sans);font-weight:700;color:var(--ink-soft);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:block}
/* controls strip */
.control-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 16px}
.ctl{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;
  background:var(--card);border:1px solid var(--rule-strong);border-radius:9px;
  font:600 13.5px var(--sans);color:var(--ink);cursor:pointer;box-shadow:var(--shadow-1);
  transition:border-color .18s ease-out,background-color .18s ease-out,transform .18s ease-out,box-shadow .18s ease-out}
.ctl:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.ctl:active{transform:translateY(0)}
.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl svg{width:16px;height:16px;flex:none}
.ctl select,.ctl input[type="date"]{font:inherit;color:inherit;background:transparent;border:0;outline:none;cursor:pointer}
.ctl input[type="date"]{cursor:text}
.ctl kbd{font:700 11px var(--mono);background:var(--paper-deep);border:1px solid var(--rule);border-radius:5px;padding:2px 6px;color:var(--ink-faint)}
.search-trigger{min-width:180px;justify-content:flex-start;color:var(--ink-faint);font-weight:500}
.search-trigger span{flex:1;text-align:left}

/* ============ SECTION NAV (tab strip) ============ */
.section-nav{background:var(--paper);border-top:1px solid var(--rule)}
.masthead .section-nav-inner{padding:0 32px}
.section-nav-inner{max-width:1440px;margin:0 auto;padding:0 32px;display:flex;gap:4px}
.dock-tab{display:inline-flex;align-items:center;gap:9px;padding:14px 20px 12px;
  background:transparent;border:0;border-bottom:3px solid transparent;cursor:pointer;
  font:700 13.5px var(--sans);letter-spacing:.04em;color:var(--ink-faint);min-height:48px;white-space:nowrap;
  transition:color .18s ease-out,border-color .18s ease-out,background-color .18s ease-out}
.dock-tab svg{width:16px;height:16px}
.dock-tab:hover{color:var(--ink);background:var(--tint-green)}
.dock-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.dock-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ============ STAGE ============ */
.stage{max-width:1440px;margin:0 auto;padding:32px}
.rule-kicker{display:flex;align-items:baseline;gap:14px;margin:0 0 6px}
.rule-kicker .kicker-no{font:700 12px var(--mono);color:var(--accent);letter-spacing:.1em}
.rule-kicker h2{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.01em}
.rule-kicker p{margin-left:auto;font-size:13px;color:var(--ink-faint);font-style:italic;font-family:var(--serif)}
.rule-double{border:0;border-top:3px double var(--rule-strong);margin:6px 0 24px}

/* ============ FIGURES ROW (KPIs) ============ */
.figures{border:1px solid var(--rule-strong);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow-2);display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden;margin-bottom:8px}
.figure{padding:22px 24px 18px;position:relative;
  transition:background-color .2s ease-out}
.figure + .figure{border-left:1px solid var(--rule)}
.figure:hover{background:var(--paper-deep)}
.figure .fig-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  display:flex;align-items:center;gap:8px;margin-bottom:10px}

.figure .fig-value{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.figure .fig-value .pct{font-size:24px}
.figure .fig-sub{font-size:12.5px;color:var(--ink-faint);margin-top:8px;font-style:italic;font-family:var(--serif)}
.fig-spark{margin-top:10px;height:34px;opacity:.9}
.fig-spark svg{width:100%;height:34px;display:block}

/* ============ STANDINGS (Top Performer feature card) ============ */
.standings{border:1px solid var(--rule-strong);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow-3);margin:32px 0;overflow:hidden;position:relative}
.standings::before{content:"";display:block;height:4px;background:var(--gold)}
.standing-head{text-align:center;padding:28px 28px 4px}
.standing-head .focus-kicker{display:inline-block;font:700 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:6px;margin-bottom:12px}
.standing-head .trophy{display:flex;justify-content:center;margin-bottom:12px}
.standing-head .trophy svg{width:48px;height:48px;color:var(--gold);animation:trophy-bob 3.2s ease-in-out infinite}
@keyframes trophy-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.standing-head h3{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.standing-head p{font-size:13.5px;color:var(--ink-faint);font-style:italic;font-family:var(--serif);margin-top:8px}
.standing-row{display:grid;grid-template-columns:64px 52px 1fr auto auto auto 40px;gap:18px;align-items:center;
  padding:18px 28px;border-top:1px solid var(--rule);cursor:pointer;min-height:72px;
  transition:background-color .18s ease-out}
.standing-row:first-of-type{border-top:0}
.standing-row:hover{background:var(--paper-deep)}
.standing-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.standing-row .rank-no{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.standing-row.lead{margin:20px 28px 8px;padding:24px 28px;border:1px solid var(--gold);border-radius:10px;
  background:var(--tint-amber);box-shadow:var(--shadow-2)}
.standing-row.lead .rank-no{color:var(--gold);font-size:44px}
.standing-row .avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font:800 15px var(--sans);border:2px solid var(--rule-strong);background:var(--paper-deep);color:var(--ink)}
.standing-row.lead .avatar{background:var(--ink);color:var(--paper);border-color:var(--ink);width:60px;height:60px;font-size:17px}
.standing-row .who h4{font-size:16.5px;font-weight:700}
.standing-row.lead .who h4{font-size:20px}
.standing-row .who span{font-size:13px;color:var(--ink-faint)}
.standing-row .stat{text-align:right}
.standing-row .stat .sl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.standing-row .stat .sv{font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.standing-row.lead .stat .sv{font-size:20px}
.standing-row .chev{color:var(--ink-faint)}
.standing-row .chev svg{width:18px;height:18px;display:block}
.lead-tag{display:inline-block;font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:3px 10px;margin-left:10px;vertical-align:2px}

/* ============ LEDGER SECTIONS ============ */
.ledger-section{border:1px solid var(--rule-strong);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow-2);margin:0 0 32px;overflow:hidden}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  padding:22px 28px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.section-head h3{font-family:var(--serif);font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.section-head h3 svg{width:20px;height:20px;color:var(--accent)}
.section-head .deck{font-size:13.5px;color:var(--ink-faint);margin-top:4px;max-width:640px}
.section-head .deck strong{color:var(--ink-soft)}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-box{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;
  border:1px solid var(--rule-strong);border-radius:9px;background:var(--paper);min-width:220px;
  transition:border-color .18s ease-out,box-shadow .18s ease-out}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint-green)}
.search-box svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
.search-box input{border:0;background:transparent;outline:none;font:500 14px var(--sans);color:var(--ink);width:100%}
.view-toggle{display:inline-flex;border:1px solid var(--rule-strong);border-radius:9px;overflow:hidden;background:var(--paper)}
.view-mode-btn{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;color:var(--ink-faint);
  transition:background-color .18s ease-out,color .18s ease-out}
.view-mode-btn svg{width:17px;height:17px}
.view-mode-btn:hover{color:var(--ink);background:var(--tint-green)}
.view-mode-btn.active{background:var(--ink);color:var(--paper)}
.view-mode-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ============ LEDGER ROWS (rank stream replacement) ============ */
.ledger-rows{padding:6px 0}
.ledger-row{display:grid;grid-template-columns:52px 1fr auto auto auto 36px;gap:18px;align-items:center;
  padding:14px 28px;border-bottom:1px solid var(--rule);cursor:pointer;min-height:64px;
  transition:background-color .18s ease-out}
.ledger-row:last-child{border-bottom:0}
.ledger-row:hover{background:var(--paper-deep)}
.ledger-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ledger-row .rank{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.ledger-row.top3 .rank{color:var(--accent)}
.ledger-row .who h4{font-size:15.5px;font-weight:700}
.ledger-row .who span{font-size:12.5px;color:var(--ink-faint)}
.ledger-row .cell{text-align:right}
.ledger-row .cell .sl{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.ledger-row .cell .sv{font-family:var(--mono);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.ledger-row .rail{width:130px;height:5px;background:var(--paper-deep);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-top:5px}
.ledger-row .rail i{display:block;height:100%;background:var(--accent);border-radius:4px;
  transition:width .5s ease-out}
.ledger-row .chev{color:var(--ink-faint)}.ledger-row .chev svg{width:16px;height:16px;display:block}

/* ============ LEDGER TABLE ============ */
.table-scroll{overflow-x:auto}
table.ledger-table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.ledger-table thead th{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
  text-align:left;padding:14px 16px;border-bottom:2px solid var(--rule-strong);background:var(--paper-deep);white-space:nowrap}
.ledger-table thead th.num,.ledger-table td.num{text-align:right}
.ledger-table tbody td{padding:13px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ledger-table tbody tr{transition:background-color .15s ease-out}
.ledger-table tbody tr:hover{background:var(--paper-deep)}
.ledger-table tbody tr:last-child td{border-bottom:0}
.ledger-table tbody tr.clickable{cursor:pointer}
.ledger-table tbody tr.row-active{background:var(--tint-green)}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--sans);padding:4px 12px;border-radius:20px;border:1px solid;white-space:nowrap}
.pill.good{color:var(--accent-deep);border-color:var(--accent);background:var(--tint-green)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--tint-amber)}
.pill.bad{color:var(--danger-deep);border-color:var(--danger);background:var(--tint-red)}
html[data-theme="dark"] .pill.good{color:var(--accent)}
html[data-theme="dark"] .pill.bad{color:var(--danger)}
.score-num{font-family:var(--mono);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.loc-tag{font:600 12px var(--sans);color:var(--ink-soft);border:1px solid var(--rule);border-radius:6px;padding:3px 9px;background:var(--paper);white-space:nowrap}
.avatar-sm{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:none;
  font:800 12px var(--sans);background:var(--paper-deep);border:1.5px solid var(--rule-strong);color:var(--ink)}

/* ============ CHART PANELS ============ */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.chart-cell{padding:24px 28px}
.chart-cell + .chart-cell{border-left:1px solid var(--rule)}
.chart-cell h4{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.chart-cell .cdeck{font-size:13px;color:var(--ink-faint);margin-bottom:14px;font-style:italic;font-family:var(--serif)}
.chart-box{position:relative}

/* ============ ERROR INTEL ============ */
.hint-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--rule);
  font-size:13px;color:var(--ink-faint);background:var(--paper)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.formula{font-family:var(--mono);font-size:14px;background:var(--paper-deep);border:1px solid var(--rule);
  border-radius:8px;padding:14px 16px;margin:14px 0;color:var(--accent-deep);font-weight:600}
html[data-theme="dark"] .formula{color:var(--accent)}
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.method-cell{padding:24px 28px;font-size:13.5px;color:var(--ink-soft);line-height:1.65}
.method-cell + .method-cell{border-left:1px solid var(--rule)}
.method-cell h4{font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:8px}
.method-cell code{font-family:var(--mono);font-size:12.5px;background:var(--paper-deep);border:1px solid var(--rule);border-radius:5px;padding:1px 6px}

/* ============ DRAWER ============ */
.drawer-backdrop{position:fixed;inset:0;background:rgba(20,16,10,.5);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;z-index:100;transition:opacity .22s ease-out}
.drawer-backdrop.active{opacity:1;pointer-events:auto}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--paper);
  border-left:1px solid var(--rule-strong);box-shadow:var(--shadow-3);display:flex;flex-direction:column;
  transform:translateX(40px);transition:transform .26s cubic-bezier(.32,.72,.28,1)}
.drawer-backdrop.active .drawer-panel{transform:translateX(0)}
.drawer-panel.wide{width:min(860px,100%)}
.drawer-head{display:flex;align-items:center;gap:16px;padding:22px 28px;border-bottom:3px double var(--rule-strong);background:var(--card)}
.drawer-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;
  font:800 19px var(--sans);background:var(--ink);color:var(--paper)}
.drawer-head h2{font-family:var(--serif);font-size:22px;font-weight:700}
.drawer-head p{font-size:13px;color:var(--ink-faint)}
.drawer-close{margin-left:auto;width:44px;height:44px;border-radius:9px;border:1px solid var(--rule-strong);
  background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink);
  transition:border-color .18s ease-out,background-color .18s ease-out}
.drawer-close:hover{border-color:var(--danger);background:var(--tint-red)}
.drawer-close svg{width:18px;height:18px}
.drawer-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drawer-body{overflow-y:auto;padding:28px;flex:1}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule-strong);border-radius:10px;
  background:var(--card);box-shadow:var(--shadow-1);margin-bottom:28px;overflow:hidden}
.mini-kpi{padding:16px 18px}
.mini-kpi + .mini-kpi{border-left:1px solid var(--rule)}
.mini-kpi span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.mini-kpi strong{font-family:var(--serif);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.deep-section{margin-bottom:32px}
.deep-section > h4{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:4px}
.deep-desc{font-size:13px;color:var(--ink-faint);margin-bottom:14px;line-height:1.6}
.drawer-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.drawer-chart-sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
.drawer-chart-wrap{position:relative;height:210px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:12px}
.drawer-chart-wrap.tall{height:300px}
.imp-card{border:1px solid var(--rule-strong);border-radius:10px;background:var(--card);margin-bottom:12px;overflow:hidden}
.imp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;cursor:pointer;min-height:52px;
  transition:background-color .18s ease-out}
.imp-head:hover{background:var(--paper-deep)}
.imp-head-main{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.imp-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.imp-tier-0 .imp-dot{background:var(--danger)}
.imp-tier-1 .imp-dot{background:var(--warn)}
.imp-badge{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:14px;padding:3px 10px;white-space:nowrap}
.imp-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 14px;font-size:13px;color:var(--ink-faint);flex-wrap:wrap}
.imp-toggle{font-size:12.5px;font-weight:600;color:var(--accent-deep)}
html[data-theme="dark"] .imp-toggle{color:var(--accent)}
.imp-detail{display:none;border-top:1px dashed var(--rule);padding:16px 18px;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.imp-detail p{margin-bottom:8px}
.log-del-btn{font:700 12px var(--sans);color:var(--danger-deep);background:transparent;border:1px solid var(--danger);
  border-radius:7px;padding:7px 12px;cursor:pointer;min-height:36px;
  transition:background-color .18s ease-out,color .18s ease-out}
html[data-theme="dark"] .log-del-btn{color:var(--danger)}
.log-del-btn:hover{background:var(--danger);color:#fff}
.deleted-note{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin:8px 0}
.cat-scroll-hint{font-size:12.5px;color:var(--ink-faint);margin-top:10px;line-height:1.6}
.rep-dot{font-size:11.5px;color:var(--ink-faint);font-style:italic}
.st-worse{color:var(--danger-deep);font-weight:700}
.st-better{color:var(--accent-deep);font-weight:700}
html[data-theme="dark"] .st-worse{color:var(--danger)}
html[data-theme="dark"] .st-better{color:var(--accent)}
.prio{font:700 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:14px;border:1px solid;white-space:nowrap}
.prio-Critical{color:var(--danger-deep);border-color:var(--danger);background:var(--tint-red)}
.prio-High{color:var(--warn);border-color:var(--warn);background:var(--tint-amber)}
.prio-Standard{color:var(--ink-faint);border-color:var(--rule-strong);background:transparent}
html[data-theme="dark"] .prio-Critical{color:var(--danger)}
.deep-dl-btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:9px;
  background:var(--ink);color:var(--paper);border:0;font:700 13.5px var(--sans);cursor:pointer;
  transition:transform .18s ease-out,box-shadow .18s ease-out}
.deep-dl-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.deep-dl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty-note{padding:48px 28px;text-align:center;color:var(--ink-faint)}
.empty-note svg{width:30px;height:30px;margin-bottom:12px;opacity:.6}
.empty-note p{font-size:14px;line-height:1.7;max-width:520px;margin:0 auto}
.empty-note strong{color:var(--ink-soft)}

/* ============ SPOTLIGHT ============ */
.spotlight-backdrop{position:fixed;inset:0;background:rgba(20,16,10,.5);backdrop-filter:blur(3px);z-index:120;
  display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.spotlight-backdrop.active{display:flex}
.spotlight-box{width:min(600px,calc(100vw - 48px));background:var(--card);border:1px solid var(--rule-strong);
  border-radius:14px;box-shadow:var(--shadow-3);overflow:hidden}
.spotlight-input{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--rule)}
.spotlight-input svg{width:18px;height:18px;color:var(--ink-faint);flex:none}
.spotlight-input input{flex:1;border:0;background:transparent;outline:none;font:500 16px var(--sans);color:var(--ink)}
.spotlight-input kbd{font:700 11px var(--mono);border:1px solid var(--rule);border-radius:5px;padding:3px 8px;color:var(--ink-faint)}
.spotlight-results{max-height:340px;overflow-y:auto;padding:8px}
.spotlight-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0;
  background:transparent;border-radius:9px;cursor:pointer;font:600 14.5px var(--sans);color:var(--ink);
  transition:background-color .15s ease-out}
.spotlight-item:hover{background:var(--paper-deep)}
.spotlight-item .meta{margin-left:auto;font-size:12px;color:var(--ink-faint);font-weight:500}

/* ============ TOASTS / IMPORT ============ */
.toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:var(--paper);font:600 13.5px var(--sans);padding:13px 18px;border-radius:10px;
  box-shadow:var(--shadow-3);display:flex;align-items:center;gap:10px;max-width:360px;
  animation:toastIn .25s cubic-bezier(.32,.72,.28,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.import-overlay{position:fixed;inset:0;background:rgba(20,16,10,.55);backdrop-filter:blur(4px);z-index:150;
  display:none;align-items:center;justify-content:center}
.import-overlay.active{display:flex}
.import-card{background:var(--card);border:1px solid var(--rule-strong);border-radius:14px;box-shadow:var(--shadow-3);
  padding:36px 40px;text-align:center;width:min(420px,calc(100vw - 48px))}
.import-ring{width:52px;height:52px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;
  margin:0 auto 18px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.import-card h3{font-family:var(--serif);font-size:20px;margin-bottom:6px}
.import-card p{font-size:13.5px;color:var(--ink-faint);margin-bottom:18px}
.import-track{height:8px;background:var(--paper-deep);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.import-fill{height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .2s ease-out}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(14px)}
.reveal.in{opacity:1;transform:none;transition:opacity .45s ease-out,transform .45s cubic-bezier(.32,.72,.28,1);transition-delay:var(--rd,0ms)}

/* ============ ERROR INTEL DRILL-DOWN ============ */
.mx-detail{margin:18px 28px 0}
.mx-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.mx-detail-kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:4px}
html[data-theme="dark"] .mx-detail-kicker{color:var(--accent)}
.mx-detail-head h4{font-family:var(--serif);font-size:19px;font-weight:700}
.mx-count{font-family:var(--sans);font-size:13px;color:var(--ink-faint);font-weight:600;margin-left:8px}
.mx-seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:9px;overflow:hidden;background:var(--paper)}
.mx-seg button{height:40px;padding:0 16px;border:0;background:transparent;font:700 12.5px var(--sans);color:var(--ink-faint);cursor:pointer;
  transition:background-color .18s ease-out,color .18s ease-out}
.mx-seg button + button{border-left:1px solid var(--rule)}
.mx-seg button:hover{color:var(--ink);background:var(--tint-green)}
.mx-seg button.active{background:var(--ink);color:var(--paper)}
.mx-seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mx-row{cursor:pointer}
.mx-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mx-people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mx-person{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--card)}
.mx-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  font:800 13px var(--sans);background:var(--paper-deep);border:1.5px solid var(--rule-strong)}
.mx-person-info{flex:1;min-width:0}
.mx-person-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-person-sub{font-size:12px;color:var(--ink-faint)}
.mx-view-btn,.mx-link-btn{font:700 12px var(--sans);color:var(--accent-deep);background:transparent;
  border:1px solid var(--accent);border-radius:7px;padding:7px 11px;cursor:pointer;min-height:36px;white-space:nowrap;
  transition:background-color .18s ease-out}
html[data-theme="dark"] .mx-view-btn,html[data-theme="dark"] .mx-link-btn{color:var(--accent)}
.mx-view-btn:hover,.mx-link-btn:hover{background:var(--tint-green)}
.mx-view-btn:focus-visible,.mx-link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mx-note{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:10px}

/* ============ RESPONSIVE ============ */
@media (max-width:1100px){
  .figures{grid-template-columns:repeat(3,1fr)}
  .figure:nth-child(4){border-left:0;border-top:1px solid var(--rule)}
  .figure:nth-child(5){border-top:1px solid var(--rule)}
  .chart-grid,.method-grid{grid-template-columns:1fr}
  .chart-cell + .chart-cell,.method-cell + .method-cell{border-left:0;border-top:1px solid var(--rule)}
  .standing-row{grid-template-columns:48px 44px 1fr auto auto 32px}
  .standing-row .stat.hide-m{display:none}
}
@media (max-width:768px){
  .masthead-inner{padding:14px 20px 0}
  .section-nav-inner{padding:0 20px;overflow-x:auto}
  .stage{padding:20px}
  .brand-name{font-size:23px}
  .dateline{display:none}
  .figures{grid-template-columns:1fr 1fr}
  .figure + .figure{border-left:0}
  .figure:nth-child(even){border-left:1px solid var(--rule)}
  .figure:nth-child(n+3){border-top:1px solid var(--rule)}
  .figure .fig-value{font-size:36px}
  .standing-row{grid-template-columns:40px 1fr auto 28px;padding:14px 20px;gap:12px}
  .standing-row .avatar,.standing-row .stat.hide-m,.standing-row .stat.hide-s{display:none}
  .ledger-row{grid-template-columns:40px 1fr auto 28px;padding:12px 20px;gap:12px}
  .ledger-row .hide-m{display:none}
  .kpi-strip{grid-template-columns:1fr 1fr}
  .mini-kpi:nth-child(3){border-left:0;border-top:1px solid var(--rule)}
  .mini-kpi:nth-child(4){border-top:1px solid var(--rule)}
  .drawer-chart-grid{grid-template-columns:1fr}
  .section-head{padding:18px 20px}
  .chart-cell,.method-cell{padding:18px 20px}
  .control-strip .ctl{height:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

<!-- MASTHEAD -->
<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-row">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>

      </button>

        Publish
      </button>
      <input type="file" id="publishFileInput" accept=".xlsx,.xls" style="display:none">
      <button class="ctl" id="screenshotBtn" title="Download PNG screenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Screenshot
      </button>
      <button class="ctl" id="themeBtn" title="Toggle light / dark theme" aria-label="Toggle light and dark theme" style="padding:0 12px">
        <span id="themeIco" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>

    </div>
  </div>
<!-- SECTION NAV -->
<nav class="section-nav" aria-label="Dashboard sections">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>

<script>


/* Mouse Interactive Spotlight Follow */
document.addEventListener("pointermove", e => {
  const x = (e.clientX / window.innerWidth) * 100;
  const y = (e.clientY / window.innerHeight) * 100;
  document.documentElement.style.setProperty("--mouse-x", x + "%");
  document.documentElement.style.setProperty("--mouse-y", y + "%");
});

/* Keyboard shortcuts */
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    openSpotlight();
  }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    openSpotlight();
  }
  if (e.key === "Escape") {
    closeDrawer();
    closeSpotlight();
  }
});

/* Toast Messaging */
function toast(msg, type = "info") {
  const container = document.getElementById("toastContainer");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--accent)">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span>${msg}</span>
  `;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "translateY(10px)";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}
/* Application State */
const STATE = {
  data: null,
  loc: "all",
  start: "",
  end: "",
  fullStart: "",
  fullEnd: "",
  view: "overview",
  viewMode: "cards", // 'cards' or 'table'
  mode: "weekly", // 'weekly' or 'monthly'
  analystFilter: "",
  specialistFilter: "",
  charts: [],
  drawerCharts: []
};

/* Kill Chart instances to prevent canvas memory leaks */
function killCharts() {
  STATE.charts.forEach(c => { try { c.destroy(); } catch (_) {} });
  STATE.charts = [];
}

/* Active Filtered Rows */
function activeRows() {
  const d = STATE.data;
  const names = new Set(d.people.filter(p => STATE.loc === "all" || p.loc === STATE.loc).map(p => p.name));

  const prodMap = new Map();
  d.prod.forEach(r => {
    if (r.date < STATE.start || r.date > STATE.end) return;
    if (!names.has(r.name)) return;
    prodMap.set(r.name, (prodMap.get(r.name) || 0) + r.productivity);
  });

  const misMap = new Map();
  d.mis.forEach(m => {
    if (m.date < STATE.start || m.date > STATE.end) return;
    if (!names.has(m.name)) return;
    misMap.set(m.name, (misMap.get(m.name) || 0) + 1);
  });

  const rows = [];
  d.people.forEach(p => {
    if (STATE.loc !== "all" && p.loc !== STATE.loc) return;
    const totalProd = prodMap.get(p.name) || 0;
    if (totalProd === 0) return;
    const mistakes = misMap.get(p.name) || 0;
    const possible = totalProd * 6;
    const er = possible ? (mistakes / possible) * 100 : 0;
    const score = totalProd * Math.pow(1 - (er / 100), 2);

    rows.push({
      ...p,
      mp: totalProd,
      errors: mistakes,
      possible,
      er,
      score
    });
  });

  return rows.sort((a, b) => b.score - a.score);
}

/* ME company method (matches ME_Overseas_Performance file) shared helper:
   per person: medProd = MEDIAN of daily productivity, er = pooled
   errors/possible, score = medProd*(1-er)^2. Respects loc + date filters. */
function medianArr(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function mePersonStats() {
  const d = STATE.data;
  const peopleByName = {};
  d.people.forEach(p => { peopleByName[p.name] = p; });
  const names = new Set(d.people.filter(p => STATE.loc === "all" || p.loc === STATE.loc).map(p => p.name));

  const dailyByName = {};
  d.prod.forEach(r => {
    if (r.date < STATE.start || r.date > STATE.end) return;
    if (!names.has(r.name)) return;
    const byDay = dailyByName[r.name] || (dailyByName[r.name] = {});
    byDay[r.date] = (byDay[r.date] || 0) + r.productivity;
  });
  const errByName = {};
  d.mis.forEach(m => {
    if (m.date < STATE.start || m.date > STATE.end) return;
    if (!names.has(m.name)) return;
    errByName[m.name] = (errByName[m.name] || 0) + 1;
  });
  return Object.keys(dailyByName).map(name => {
    const p = peopleByName[name] || {};
    const dailies = Object.values(dailyByName[name]);
    const medProd = medianArr(dailies);
    const totProd = dailies.reduce((s, v) => s + v, 0);
    const errs = errByName[name] || 0;
    const poss = totProd * 6;
    const errFrac = poss ? errs / poss : 0;
    return {
      id: p.id || ("p" + name.replace(/[^a-z0-9]/gi, "").slice(0, 12)),
      name, role: p.role || "analyst", loc: p.loc || "",
      am: p.am || "", tl: p.tl || "", home: p.home || "Legacy",
      mp: medProd, errors: errs, possible: poss,
      er: errFrac * 100, score: medProd * Math.pow(1 - errFrac, 2)
    };
  }).sort((a, b) => b.score - a.score);
}

/* Grouping rollups */
function rollup(rows, key) {
  const grps = {};
  rows.forEach(r => {
    const k = r[key] || "Other";
    if (!grps[k]) grps[k] = { name: k, members: [], mp: 0, errors: 0, possible: 0, am: r.am };
    grps[k].members.push(r);
    grps[k].mp += r.mp;
    grps[k].errors += r.errors;
    grps[k].possible += r.possible;
  });

  return Object.values(grps).map(g => {
    const er = g.possible ? (g.errors / g.possible) * 100 : 0;
    const score = g.mp * Math.pow(1 - (er / 100), 2);
    return { ...g, count: g.members.length, er, score };
  });
}

function getInitials(name) {
  return (name || "").split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase() || "QA";
}

function fmt(n) {
  return typeof n === "number" ? n.toLocaleString(undefined, { maximumFractionDigits: 1 }) : n;
}

/* Normalize a raw location value to the canonical hub name (case-insensitive) */
function normLoc(loc) {
  const t = String(loc || "").trim().toLowerCase();
  if (t === "chandigarh") return "Chandigarh";
  if (t === "dhaka") return "Dhaka";
  return "";
}
/* Display location: only Chandigarh & Dhaka are valid hubs; everything else renders blank */
function dispLoc(loc) {
  return normLoc(loc);
}

/* ============================================================
   INLINE SPARKLINE SVG GENERATOR
   ============================================================ */
function buildSvgSparkline(dataPoints, color = "#2E9E67", height = 40) {
  if (!dataPoints || dataPoints.length < 2) return "";
  const min = Math.min(...dataPoints);
  const max = Math.max(...dataPoints);
  const range = max - min || 1;
  const width = 180;
  const step = width / (dataPoints.length - 1);

  const points = dataPoints.map((val, idx) => {
    const x = idx * step;
    const y = height - ((val - min) / range) * (height - 8) - 4;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });

  const pathD = "M " + points.join(" L ");
  const areaD = `${pathD} L ${width},${height} L 0,${height} Z`;

  return `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">
      <defs>
        <linearGradient id="sparkGrad_${color.replace(/[^a-zA-Z0-9]/g, '')}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#sparkGrad_${color.replace(/[^a-zA-Z0-9]/g, '')})"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;
}

/* ============================================================
   MEMBER DEEP-DIVE: FULL WORK HISTORY (ported from QA report)
   Click any member -> W1 vs W2 summary, daily trends, variable
   distribution, category trends, category breakdown w/ status &
   priority, coaching notes, deletable error log, report download.
   ============================================================ */
const DRAWER = { person: null, weeks: null, series: [], mistakes: [], deleted: new Set(), catRows: [], liveTotal: 0, catFilter: "" };

function destroyDrawerCharts() {
  (STATE.drawerCharts || []).forEach(c => { try { c.destroy(); } catch (_) {} });
  STATE.drawerCharts = [];
}

function deepChartTheme() {
  const dark = document.documentElement.dataset.theme === "dark";
  return { grid: dark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.07)", tick: dark ? "#64748b" : "#94a3b8" };
}

/* Split selected range into two halves (W1 = first half, W2 = second) */
/* Single reporting period (Week 1) — the full selected date range, no split */
function periodInfo() {
  const dates = [...new Set(STATE.data.prod.map(r => r.date))].filter(d => d >= STATE.start && d <= STATE.end).sort();
  const f = d => { const dt = new Date(d + "T00:00:00"); return isNaN(dt) ? d : dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const lbl = dates.length ? f(dates[0]) + " \u2013 " + f(dates[dates.length - 1]) : "\u2014";
  return { dates, label: "Week 1 (" + lbl + ")" };
}

/* Per-day productivity + error counts for one member */
function memberDailySeries(name) {
  const d = STATE.data, map = {};
  d.prod.forEach(r => {
    if (r.name !== name || r.date < STATE.start || r.date > STATE.end) return;
    const e = map[r.date] || (map[r.date] = { prod: 0, err: 0 });
    e.prod += r.productivity;
  });
  d.mis.forEach(m => {
    if (m.name !== name || m.date < STATE.start || m.date > STATE.end) return;
    const e = map[m.date] || (map[m.date] = { prod: 0, err: 0 });
    e.err += 1;
  });
  return Object.entries(map).map(([date, v]) => {
    const possible = v.prod * 6;
    return { date, prod: v.prod, err: v.err, possible, er: possible ? (v.err / possible) * 100 : 0 };
  }).sort((a, b) => a.date < b.date ? -1 : 1);
}

/* Priority from share of member's errors: >20% Critical, >10% High, else Standard */
function varPriority(share) { return share > 0.2 ? "Critical" : share > 0.1 ? "High" : "Standard"; }

function delKey(name) { return "op-del-" + String(name).toLowerCase(); }
function getDeleted(name) { try { return new Set(JSON.parse(localStorage.getItem(delKey(name)) || "[]")); } catch (_) { return new Set(); } }
function saveDeleted(name, set) { try { localStorage.setItem(delKey(name), JSON.stringify([...set])); } catch (_) {} }

function liveMistakes() {
  const out = [];
  DRAWER.mistakes.forEach((m, idx) => { if (!DRAWER.deleted.has(idx)) out.push({ m, idx }); });
  return out;
}

function refreshDrawerCats() {
  const live = liveMistakes();
  const total = live.length;
  const map = {};
  live.forEach(({ m }) => {
    const e = map[m.variable] || (map[m.variable] = { v: m.variable, total: 0 });
    e.total++;
  });
  DRAWER.catRows = Object.values(map).map(e => {
    const share = total ? e.total / total : 0;
    return { v: e.v, total: e.total, pct: share * 100, priority: varPriority(share) };
  }).sort((a, b) => b.total - a.total);
  DRAWER.liveTotal = total;
}

/* Split the selected range into consecutive 7-day weeks (full month coverage:
   W1..WN) for the Monthly comparison */
function splitWeeks() {
  const dates = [...new Set(STATE.data.prod.map(r => r.date))].filter(d => d >= STATE.start && d <= STATE.end).sort();
  if (!dates.length) return [];
  const f = d => { const dt = new Date(d + "T00:00:00"); return isNaN(dt) ? d : dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const t0 = new Date(dates[0] + "T00:00:00").getTime();
  const dayIdx = d => Math.floor((new Date(d + "T00:00:00").getTime() - t0) / 864e5);
  const nW = Math.floor(dayIdx(dates[dates.length - 1]) / 7) + 1;
  const weeks = [];
  for (let k = 0; k < nW; k++) {
    const arr = dates.filter(d => Math.floor(dayIdx(d) / 7) === k);
    const lbl = arr.length ? f(arr[0]) + " \u2013 " + f(arr[arr.length - 1]) : "\u2014";
    weeks.push({ dates: arr, set: new Set(arr), label: "W" + (k + 1) + " (" + lbl + ")", short: "W" + (k + 1) });
  }
  return weeks;
}

/* Monthly comparison: Complete Error Category Breakdown across ALL analysts'
   history (Romana method) — per-week counts for every week, status (last week
   vs first week) and priority per variable. */
function renderMonthlyCats() {
  const tb = document.getElementById("deepCatBody");
  if (!tb) return;
  const R = (DRAWER.range && DRAWER.range.length ? DRAWER.range : splitWeeks());
  const N = R.length;
  if (!N) { tb.innerHTML = `<tr><td style="color:var(--ink-faint)">No error records.</td></tr>`; return; }
  const scope = new Set(STATE.data.people.filter(p => STATE.loc === "all" || p.loc === STATE.loc).map(p => p.name));
  const perVar = {}, tot = {};
  STATE.data.mis.forEach(m => {
    if (m.date < STATE.start || m.date > STATE.end || !scope.has(m.name)) return;
    const v = m.variable || "Other";
    let wi = -1;
    for (let k = 0; k < N; k++) { if (R[k].set.has(m.date)) { wi = k; break; } }
    if (wi < 0) return;
    const arr = perVar[v] || (perVar[v] = new Array(N).fill(0));
    arr[wi]++;
    tot[v] = (tot[v] || 0) + 1;
  });
  const totalAll = Object.values(tot).reduce((s, v) => s + v, 0);
  const keys = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
  DRAWER.compRows = {
    weeks: R.map(wk => wk.short),
    rows: keys.map(k => {
      const counts = perVar[k];
      const t = tot[k];
      const share = totalAll ? t / totalAll : 0;
      const prio = share > 0.2 ? "Critical" : share > 0.1 ? "High" : "Standard";
      const cFirst = counts[0], cLast = counts[N - 1];
      const earlier = counts.slice(0, -1).reduce((s, v) => s + v, 0);
      let status = "No change", cls = "";
      if (earlier > 0 && cLast > 0) {
        if (cLast > cFirst) { status = "Worsened"; cls = "st-worse"; }
        else if (cLast < cFirst) { status = "Improved"; cls = "st-better"; }
      }
      else if (earlier === 0 && cLast > 0) status = "New in W" + N;
      else if (cLast === 0 && earlier > 0) { status = "Resolved"; cls = "st-better"; }
      const rep = counts.filter(c => c > 0).length > 1;
      return { v: k, counts, t, pct: share * 100, prio, status, cls, rep };
    })
  };
  tb.innerHTML = DRAWER.compRows.rows.map(c => {
    return `
    <tr class="clickable ${DRAWER.catFilter === c.v ? "row-active" : ""}" data-var="${c.v}">
      <td><strong>${c.v}</strong></td>
      ${c.counts.map(n => `<td class="mono-val">${n}</td>`).join("")}
      <td class="mono-val"><b>${c.t}</b></td>
      <td class="mono-val">${c.pct.toFixed(1)}%</td>
      <td class="${c.cls}">${c.status}${c.rep ? ' <span class="rep-dot">&middot; repeated</span>' : ""}</td>
      <td><span class="prio prio-${c.prio}">${c.prio}</span></td>
    </tr>`;
  }).join("") || `<tr><td colspan="${4 + N}" style="color:var(--ink-faint)">No error records.</td></tr>`;
  const dn = document.getElementById("deepDeletedNote");
  if (dn) dn.textContent = "Team-wide comparison across all analysts (full submitted data). Member log deletions below do not affect this table.";
}

/* Improvement Plan & Coaching Focus (Romana method): top 4 error fields by
   volume with expandable coaching detail. Fields above 30 errors are flagged
   for focused coaching. */
function impPlanRows() {
  const live = liveMistakes();
  const total = live.length;
  const byVar = {};
  live.forEach(({ m }) => {
    const v = m.variable || "Other";
    byVar[v] = (byVar[v] || 0) + 1;
  });
  return Object.entries(byVar)
    .map(([v, c]) => ({ v, c, pct: total ? (c / total) * 100 : 0, hot: c > 30 }))
    .sort((a, b) => b.c - a.c)
    .slice(0, 4);
}
function renderImpPlan() {
  const box = document.getElementById("impPlanList");
  if (!box) return;
  const rows = impPlanRows();
  if (!rows.length) {
    box.innerHTML = `<p class="deep-desc" style="margin-top:10px">Pristine record \u2014 zero active errors logged for this member, no coaching action required.</p>`;
    return;
  }
  const badges = ["Priority Focus", "Also Watch", "Focus Area"];
  box.innerHTML = rows.map((r, i) => {
    const tier = i === 0 ? 0 : (i === 1 ? 1 : 2);
    return `
    <div class="imp-card imp-tier-${tier}">
      <div class="imp-head" data-v="${r.v}">
        <div class="imp-head-main"><span class="imp-dot"></span>${r.v}</div>
        <span class="imp-badge">${badges[tier]}</span>
      </div>
      <div class="imp-meta">
        <span class="mono-val"><b>${r.c}</b> errors &middot; ${r.pct.toFixed(1)}% of total${r.hot ? " &middot; exceeds 30-error threshold" : ""}</span>
        <span class="imp-toggle">Click to view coaching message \u25BE</span>
      </div>
      <div class="imp-detail">
        <p><b>Category:</b> ${r.v}</p>

        <p>${varCoachMsg(r.v)}</p>

    </div>`;
  }).join("");
}

/* Value labels on category trend points */
const deepValLabels = {
  id: "deepValLabels",
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      meta.data.forEach((pt, i) => {
        const v = ds.data[i];
        if (!v) return;
        ctx.save();
        ctx.fillStyle = ds.borderColor;
        ctx.font = "700 9px 'JetBrains Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText(String(v), pt.x, pt.y - 7);
        ctx.restore();
      });
    });
  }
};

function renderDrawerCharts() {
  if (typeof Chart === "undefined") return;
  const th = deepChartTheme();
  const period = DRAWER.period;

  const legend = { position: "bottom", labels: { boxWidth: 11, font: { size: 10.5 }, color: th.tick } };
  const xy = {
    y: { beginAtZero: true, ticks: { color: th.tick }, grid: { color: th.grid } },
    x: { ticks: { color: th.tick, maxRotation: 45 }, grid: { display: false } }
  };

  mk("deepErrTrend", {
    type: "line",
    data: { labels, datasets: [
      { label: "Error rate " + period.label, data: series.map(s => +s.er.toFixed(2)), borderColor: "#2E9E67", backgroundColor: "#2E9E67", tension: .3, pointRadius: 3 }
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend, tooltip: { callbacks: { label: c => " " + c.dataset.label + ": " + c.parsed.y + "%" } } }, scales: xy }
  });
  mk("deepProdTrend", {
    type: "line",
    data: { labels, datasets: [
      { label: "Productivity " + period.label, data: series.map(s => +s.prod.toFixed(2)), borderColor: "#2E9E67", backgroundColor: "#2E9E67", tension: .3, pointRadius: 3 }
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend }, scales: xy }
  });

  const cats = DRAWER.catRows.slice(0, 12);
  mk("deepVarDist", {
    type: "bar",
    data: { labels: cats.map(c => c.v), datasets: [{ data: cats.map(c => c.total), backgroundColor: "#2E9E67", borderRadius: 4 }] },
    options: {
      indexAxis: "y", responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { color: th.tick, precision: 0 }, grid: { color: th.grid } },
        y: { ticks: { color: th.tick, font: { size: 10 } }, grid: { display: false } }
      }
    }
  });

  mk("deepDailyErr", {
    type: "bar",
    data: { labels, datasets: [{ label: "Errors", data: series.map(s => s.err), backgroundColor: "#5B6BC0", borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: xy }
  });

  const top5 = DRAWER.catRows.slice(0, 5);

  const palette = ["#C0392B", "#C08A1E", "#2E9E67", "#4A7FB5", "#8A6FC9"];
  const tds = top5.map((c, i) => ({
    label: c.v, data: series.map(s => (dayVar[s.date] && dayVar[s.date][c.v]) || null),
    borderColor: palette[i % 5], backgroundColor: palette[i % 5], tension: .3, pointRadius: 3, fill: false
  }));
  mk("deepCatTrend", {
    type: "line",
    data: { labels, datasets: tds },

        x: { ticks: { color: th.tick, maxRotation: 45 }, grid: { display: false }, title: { display: true, text: "Date", color: th.tick, font: { size: 11 } } }
      }
    }
  });
}

/* Normalizes Excel serials (46232.0) and date strings to YYYY-MM-DD */
function parseSheetDate(v) {
  if (v === null || v === undefined || v === "") return "";
  const s = String(v).trim();
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    if (n > 20000 && n < 80000) {
      return new Date(Math.round((n - 25569) * 864e5)).toISOString().slice(0, 10);
    }
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? "" : d.toISOString().slice(0, 10);
}

/* Case/space-insensitive cell lookup ("Location " vs "location") */
function cell(row, ...keys) {
  for (const k of keys) {
    const direct = row[k] !== undefined ? row[k] : row[Object.keys(row).find(rk => rk.trim().toLowerCase() === k.trim().toLowerCase())];
    if (direct !== undefined && direct !== null && String(direct).trim() !== "" && String(direct).trim().toLowerCase() !== "nan") {
      return String(direct).trim();
    }
  }
  return "";
}

document.getElementById("screenshotBtn").onclick = async () => {
  if (typeof htmlToImage === "undefined") {
    toast("Screenshot library not loaded — check your connection and retry", "warn");
    return;
  }
  toast("Capturing screenshot…");
  /* Save/restore list for every temporary DOM tweak below. */
  const savedStyles = [];
  const saveStyle = (el, prop) => savedStyles.push([el, prop, el.style.getPropertyValue(prop)]);
  const restoreAll = () => {
    savedStyles.forEach(([el, prop, val]) => {
      if (val) el.style.setProperty(prop, val); else el.style.removeProperty(prop);
    });
    revealed.forEach(([el, rd]) => {
      el.classList.remove("in");
      if (rd) el.style.setProperty("--rd", rd); else el.style.removeProperty("--rd");
    });
    if (toasts) toasts.style.display = toastDisplay;
  };
  const revealed = [];
  const toasts = document.getElementById("toastContainer");
  const toastDisplay = toasts ? toasts.style.display : "";
  try {
    try { await document.fonts.ready; } catch (_) {}

    /* 1. Expand internal scroll containers (leaderboard / error tables) so
       rows clipped below the fold render in full. */
    document.querySelectorAll(".table-scroll").forEach(el => {
      if (el.scrollHeight > el.clientHeight + 1) {
        saveStyle(el, "max-height");
        saveStyle(el, "overflow");
        el.style.setProperty("max-height", "none");
        el.style.setProperty("overflow", "visible");
      }
    });

    /* 2. Force-reveal anything the scroll observer hasn't shown yet
       (e.g. rows hidden inside the scrollers above) with zero stagger
       delay, then wait for the fade to settle. */
    document.querySelectorAll(".reveal:not(.in)").forEach(el => {
      revealed.push([el, el.style.getPropertyValue("--rd")]);
      el.style.setProperty("--rd", "0ms");
      el.classList.add("in");
    });
    if (revealed.length) await new Promise(r => setTimeout(r, 650));

    /* 3. Keep the "Capturing screenshot…" toast itself out of the shot. */
    if (toasts) toasts.style.display = "none";

    /* 4. Full-page HD capture: whole document, 2x pixel ratio. */
    const root = document.documentElement;
    const w = Math.max(root.scrollWidth, root.clientWidth);
    const h = Math.max(root.scrollHeight, root.clientHeight);
    const dataUrl = await htmlToImage.toPng(root, {
      cacheBust: true,
      pixelRatio: 2,
      width: w,
      height: h
    });

    restoreAll();
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = "team-shammi-sultana-" + STATE.view + "-" + (STATE.start || "all") + "_to_" + (STATE.end || "all") + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("Screenshot downloaded");
  } catch (err) {
    try { restoreAll(); } catch (_) {}
    toast("Screenshot failed: " + err.message, "warn");
  }
};

async function importWorkbook(arrayBuffer) {
  try {
    setImportProgress(38, "Reading workbook…");
    await new Promise(r => setTimeout(r, 60)); // let the overlay paint before heavy sync work
    const t0 = performance.now();

    const wb = XLSX.read(arrayBuffer, { type: "array" });
      setImportProgress(null, "Parsing sheets…");
      await new Promise(r => setTimeout(r, 30));

      setImportProgress(null, "Scanning sheets…");
      await new Promise(r => setTimeout(r, 30));

      /* Stream each sheet one at a time (real workbooks can hold ~300k mistake
         rows) — release every raw sheet as soon as its rows are converted. */
      const excludeSet = new Set();
      let dbRows = null;
      const prod = [];
      const mis = [];
      const stats = {};
      const bump = (map, key) => { if (key) map[key] = (map[key] || 0) + 1; };
      const top = map => Object.entries(map).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
      let prodSheetCount = 0, misSheetCount = 0;

      const sheetNames = Object.keys(wb.Sheets);
      for (const n of sheetNames) {
        const t = n.trim().toLowerCase();
        if (t === "exclude") {
          XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "" }).forEach(r => {
            const id = cell(r, "User ID", "name", "analyst_login");
            if (id) excludeSet.add(id.toLowerCase());
          });
          wb.Sheets[n] = null;
          continue;
        }
        if (t === "database" || t === "people" || t === "team") {
          dbRows = XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "" });
          wb.Sheets[n] = null;
          continue;
        }
        const isProd = t.includes("productivity");
        const isMis = t.includes("mistake");
        if (!isProd && !isMis) continue;

        setImportProgress(null, `Processing “${n}”…`);
        await new Promise(r => setTimeout(r, 30));
        const platform = t.includes("ipa") ? "IPA" : "Legacy";
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: "" });
        wb.Sheets[n] = null;

        rows.forEach(r => {
          const name = cell(r, "analyst_login", "name").toLowerCase();
          const date = parseSheetDate(isProd ? cell(r, "completed_date", "date") : cell(r, "mistake_date", "date", "completed_date"));
          if (!name || !date || excludeSet.has(name)) return;
          const s = stats[name] || (stats[name] = { tl: {}, am: {}, loc: {} });
          const loc = cell(r, "Location", "location");
          if (isProd) {
            prod.push({
              name, date,
              productivity: parseFloat(cell(r, "productivity_score", "productivity")) || 0,
              platform, loc,
              tasks: parseFloat(cell(r, "total_tasks")) || 0
            });
          } else {
            mis.push({
              name, date,
              variable: cell(r, "variable", "task_type", "mistake_area") || "Other",
              restaurant: cell(r, "Unit Name", "restaurant") || "Unknown",
              order: cell(r, "order_url") || "",
              platform, loc
            });
          }
          bump(s.loc, loc);
          bump(s.tl, cell(r, "team_lead_login", "Team", "tl").toLowerCase());
          bump(s.am, cell(r, "Concerning AM", "assistant_manager", "am").toLowerCase());
        });
        if (isProd) prodSheetCount++; else misSheetCount++;
      }

      if (!prodSheetCount || !misSheetCount) {
        hideImportOverlay();
        toast("Missing required tabs: a Productivity sheet and a Mistake Detail sheet", "warn");
        return;
      }

      if (!prod.length) {
        hideImportOverlay();
        toast("No readable productivity records found — check the sheet columns", "warn");
        return;
      }

      setImportProgress(null, "Building roster…");
      await new Promise(r => setTimeout(r, 30));

      /* People: Database sheet first, then enrich from telemetry */
      const people = [];
      const seen = new Set();
      const pushPerson = (name, src) => {
        if (!name || seen.has(name)) return;
        seen.add(name);
        const desig = (src.desig || "").toLowerCase();
        people.push({
          id: "p" + name.replace(/[^a-z0-9]/g, "").slice(0, 12),
          name,
          role: desig.includes("specialist") ? "spec" : "analyst",
          am: src.am || "",
          tl: src.tl || "",
          loc: normLoc(src.loc),
          home: src.home || "Legacy"
        });
      };

      if (dbRows) {
        dbRows.forEach(r => {
          const name = cell(r, "User ID", "name", "analyst_login").toLowerCase();
          if (!name || excludeSet.has(name)) return;
          pushPerson(name, {
            desig: cell(r, "Designation", "role"),
            am: cell(r, "Concerning AM", "assistant_manager", "am").toLowerCase(),
            tl: cell(r, "Team", "team_lead", "tl").toLowerCase(),
            loc: cell(r, "Location", "location"),
            home: cell(r, "System", "home_system") || "Legacy"
          });
        });
      }

      const loginSet = new Set([
        ...prod.map(r => r.name),
        ...mis.map(r => r.name)
      ]);
      loginSet.forEach(name => {
        if (excludeSet.has(name)) return;
        const s = stats[name] || { tl: {}, am: {}, loc: {} };
        pushPerson(name, { tl: top(s.tl), am: top(s.am), loc: top(s.loc) });
      });
      people.forEach(p => {
        const s = stats[p.name] || { tl: {}, am: {}, loc: {} };
        if (!p.tl) p.tl = top(s.tl);
        if (!p.am) p.am = top(s.am);
        if (!p.loc) p.loc = normLoc(top(s.loc));
      });

      /* Keep only rows that belong to a known (non-excluded) person */
      const valid = new Set(people.map(p => p.name));
      const data = {
        people,
        prod: prod.filter(r => valid.has(r.name)),
        mis: mis.filter(r => valid.has(r.name)),
        builtIn: false
      };

      setImportProgress(92, "Computing date range…");
      await new Promise(r => setTimeout(r, 30));

      const ds = [...new Set(data.prod.map(r => r.date))].sort();
      if (ds.length) {
        STATE.fullStart = STATE.start = ds[0];
        STATE.fullEnd = STATE.end = ds[ds.length - 1];
        startDate.value = STATE.start;
        endDate.value = STATE.end;
      }
      STATE.loc = "all";
      STATE.data = data;
      refreshLocFilter();
      detectMode();
      render();

      setImportProgress(100, "Import complete");
      setTimeout(hideImportOverlay, 450);

      let persisted = true;
      try { localStorage.setItem("op-data", JSON.stringify(data)); }
      catch (_) {
        persisted = false;
        try { localStorage.removeItem("op-data"); } catch (_) {}
      }
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      toast(`Imported ${data.prod.length.toLocaleString()} productivity records, ${data.mis.length.toLocaleString()} mistakes, ${data.people.length} people in ${secs}s${persisted ? "" : " (too large to persist — re-import after refresh)"}`, persisted ? "ok" : "warn");
    } catch (err) {
      hideImportOverlay();
      toast("Error parsing Excel workbook: " + err.message, "warn");
      console.error(err);
    }
}

/* ============================================================
   PREMIUM MOTION ENGINE — staggered reveals, KPI count-ups,
   cinematic progress fills. Re-run after every render().
   ============================================================ */
let revealObserver = null;
function initRevealAnimations() {
  document.querySelectorAll(".reveal").forEach(el => el.classList.remove("reveal", "in"));
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("in");
        revealObserver.unobserve(e.target);
        /* Drop the helper classes once the entrance finishes so the
           element rests on its natural styles (hovers keep working). */
        e.target.addEventListener("animationend", () => {
          e.target.classList.remove("reveal", "in");
          e.target.style.removeProperty("--rd");
        }, { once: true });
      }
    });
  }, { threshold: 0.06, rootMargin: "0px 0px -3% 0px" });

  const stagger = (sel, step, cap) => {
    document.querySelectorAll("#mainContentArea " + sel).forEach((el, i) => {
      el.classList.add("reveal");
      el.style.setProperty("--rd", Math.min(i * step, cap) + "ms");
      revealObserver.observe(el);
    });
  };
  stagger(".figure", 90, 450);
  stagger(".standing-row", 130, 400);
  stagger(".ledger-section", 70, 350);
  stagger(".ledger-row", 24, 650);
  stagger(".ledger-table tbody tr", 14, 550);
  stagger(".mx-person", 30, 500);

  /* Cinematic progress-rail fills */
  document.querySelectorAll("#mainContentArea .rail i").forEach(f => {
    const w = f.style.width || "0%";
    f.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.width = w; }));
  });

  /* KPI count-up numbers */
  document.querySelectorAll("#mainContentArea .fig-value").forEach(countUp);
}

function countUp(el) {
  const raw = (el.textContent || "").trim().replace(/,/g, "");
  const m = raw.match(/^(-?[\d.]+)(.*)$/);
  if (!m || !isFinite(+m[1])) return;
  const target = parseFloat(m[1]);
  const suffix = m[2] || "";
  const dec = (m[1].split(".")[1] || "").length;
  const dur = 1150;
  const t0 = performance.now();
  const fmtV = v => v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suffix;
  el.textContent = fmtV(0);
  (function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 4);
    el.textContent = fmtV(target * e);
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

/* Auto-detect analysis period from the uploaded file: a file spanning more
   than 10 distinct dates behaves as a Monthly report (team-wide week-by-week
   comparison); anything shorter stays a Weekly report. */
function detectMode() {
  const ds = [...new Set(STATE.data.prod.map(r => r.date))];
  STATE.mode = ds.length > 10 ? "monthly" : "weekly";
}

let _sb = null;
function sbClient() {
  if (!_sb) _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function fetchLiveFile() {
  const url = SUPABASE_URL + "/storage/v1/object/public/" + LIVE_BUCKET + "/" + LIVE_PATH + "?t=" + Date.now();
  const res = await fetch(url);

function ensurePublishModal() {
  if (document.getElementById("publishModal")) return;
  const m = document.createElement("div");
  m.id = "publishModal";
  m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999";
  m.innerHTML =
    '<div style="background:var(--card,#fff);color:var(--ink,#111);border:1px solid var(--hairline,rgba(0,0,0,.15));border-radius:14px;padding:26px;width:min(360px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.35)">'

    + '<input id="pubEmail" type="email" placeholder="Email" autocomplete="username" style="width:100%;padding:10px 12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--hairline,rgba(0,0,0,.2));background:transparent;color:inherit">'
    + '<input id="pubPass" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:10px 12px;margin-bottom:6px;border-radius:8px;border:1px solid var(--hairline,rgba(0,0,0,.2));background:transparent;color:inherit">'
    + '<p id="pubErr" style="font-size:12px;color:#c0392b;min-height:18px;margin-bottom:8px"></p>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end">'
    + '<button id="pubCancel" class="ctl">Cancel</button>'
    + '<button id="pubGo" class="ctl">Sign in</button>'
    + "</div></div>";
  document.body.appendChild(m);
  document.getElementById("pubCancel").onclick = () => { m.style.display = "none"; };
  m.addEventListener("click", e => { if (e.target === m) m.style.display = "none"; });
  document.getElementById("pubGo").onclick = async () => {
    const email = document.getElementById("pubEmail").value.trim();
    const password = document.getElementById("pubPass").value;
    const errEl = document.getElementById("pubErr");
    errEl.textContent = "";
    if (!email || !password) { errEl.textContent = "Enter your email and password."; return; }
    try {
      const { error } = await sbClient().auth.signInWithPassword({ email, password });
      if (error) throw error;
      m.style.display = "none";
      toast("Signed in — choose the workbook to publish.");
      document.getElementById("publishFileInput").click();
    } catch (err) {
      errEl.textContent = err.message || "Sign-in failed.";
    }
  };
}
function wirePublish() {
  const btn = document.getElementById("publishBtn");
  if (!btn || btn.dataset.wired) return;
  btn.dataset.wired = "1";
  btn.onclick = async () => {
    if (!liveConfigured()) { toast("Live publishing is not configured in this build.", "warn"); return; }
    try {
      const { data } = await sbClient().auth.getSession();
      if (data && data.session) { document.getElementById("publishFileInput").click(); return; }
    } catch (_) {}
    ensurePublishModal();
    document.getElementById("publishModal").style.display = "flex";
  };
  document.getElementById("publishFileInput").onchange = async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const titleEl = document.getElementById("importOverlayTitle");
    const prevTitle = titleEl ? titleEl.textContent : "";
    try {
      if (titleEl) titleEl.textContent = "Publishing Workbook";
      setImportProgress(12, "Uploading…");
      await new Promise(r => setTimeout(r, 60));
      const { error } = await sbClient().storage.from(LIVE_BUCKET).upload(LIVE_PATH, file, {
        upsert: true,
        contentType: file.type || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
      if (error) throw error;
      toast("Published — live for everyone now.");
      await importWorkbook(await file.arrayBuffer());
    } catch (err) {
      hideImportOverlay();
      toast("Publish failed: " + (err.message || err), "warn");
    } finally {
      if (titleEl) titleEl.textContent = prevTitle;
    }
  };
}

/* Bootstrapping */
(async function boot() {
  /* Premium chart motion defaults */
  if (typeof Chart !== "undefined") {
    Chart.defaults.animation.duration = 1100;
    Chart.defaults.animation.easing = "easeOutQuart";
    Chart.defaults.font.family = "'Outfit', -apple-system, sans-serif";
  }
  const th = localStorage.getItem("op-theme") || "light";
  document.documentElement.dataset.theme = th;
  updateThemeUI(th);

  /* Admin publishing controls: reveal before anything can return early.
     Hidden on the plain public link. */
  if (location.hash === "#admin" || new URLSearchParams(location.search).has("admin")) {
    const pubBtn = document.getElementById("publishBtn");
    if (pubBtn) pubBtn.style.display = "";
    wirePublish();
  }

  if (liveConfigured()) {
    try {
      const liveBuf = await fetchLiveFile();
      if (liveBuf) { await importWorkbook(liveBuf); return; }
    } catch (_) { /* fall through to blank state */ }
  }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("op-data")); } catch (_) {}
  STATE.data = saved && saved.prod ? saved : { people: [], prod: [], mis: [], builtIn: false };
  /* Normalize locations on previously imported data (older imports stored raw case) */
  if (STATE.data && STATE.data.people) STATE.data.people.forEach(p => { p.loc = normLoc(p.loc); });

  const ds = [...new Set(STATE.data.prod.map(r => r.date))].sort();
  if (ds.length) {
    STATE.fullStart = STATE.start = ds[0];
    STATE.fullEnd = STATE.end = ds[ds.length - 1];
    startDate.value = STATE.start;
    endDate.value = STATE.end;
  }
  refreshLocFilter();
  detectMode();
  render();
})();
